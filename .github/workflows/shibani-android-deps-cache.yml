name: SHIBANI Android Dependency Cache

on:
  push:
    branches: [shibani-deps-cache-temp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Create public dependency-only synthetic Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps-project/app/src/main
          cat > deps-project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShibaniDependencyCache"
          include(":app")
          EOF
          cat > deps-project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
              id("com.google.devtools.ksp") version "2.3.9" apply false
              id("androidx.room") version "2.8.4" apply false
          }
          EOF
          cat > deps-project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
              id("androidx.room")
          }
          android {
              namespace = "cache.only"
              compileSdk = 36
              defaultConfig {
                  applicationId = "cache.only"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          room { schemaDirectory("$projectDir/schemas") }
          dependencies {
              implementation(platform("org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1"))
              testImplementation(platform("org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1"))
              androidTestImplementation(platform("org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1"))
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              ksp("androidx.room:room-compiler:2.8.4")
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              testImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.room:room-testing:2.8.4")
              androidTestImplementation("androidx.test:core:1.7.0")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          tasks.register("resolveAllDependencies") {
              doLast {
                  var count = 0
                  configurations.filter { it.isCanBeResolved }.sortedBy { it.name }.forEach { cfg ->
                      println("RESOLVE ${cfg.name}")
                      cfg.resolve()
                      count++
                  }
                  println("RESOLVED_CONFIGURATIONS=$count")
              }
          }
          EOF
          cat > deps-project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF

      - name: Resolve all SHIBANI dependency configurations
        working-directory: deps-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:resolveAllDependencies | tee ../dependency-resolution.txt
          grep -q 'RESOLVED_CONFIGURATIONS=' ../dependency-resolution.txt

      - name: Prove key dependency cache entries
        shell: bash
        run: |
          set -euo pipefail
          find "$HOME/.gradle/caches" -type f -name 'gradle-9.2.0.jar' -print -quit | grep .
          find "$HOME/.gradle/caches" -type f -name '*room-compiler*2.8.4*' -print -quit | grep .
          find "$HOME/.gradle/caches" -type f -iname '*compose*' | head -5

      - name: Package Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp dependency-resolution.txt out/
          tar -czf out/shibani-gradle-cache.tgz -C "$HOME/.gradle" caches
          sha256sum out/shibani-gradle-cache.tgz | tee out/SHA256SUMS.txt
          du -h out/shibani-gradle-cache.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: shibani-v110-public-dependency-cache
          path: out/*
          if-no-files-found: error
          retention-days: 1
